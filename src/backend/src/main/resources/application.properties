spring.application.name=restaurant-booking
server.port=8080

# MySQL 8 (default profile). Put your own credentials in application-local.properties
# next to pom.xml (that file is git-ignored) or in the DB_USERNAME / DB_PASSWORD variables.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_booking?createDatabaseIfNotExist=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (db/migration); Hibernate only maps it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Session cookie used by the React client; SameSite=Strict protects the JSON API against CSRF
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h

# Seed staff accounts, sections and tables on first start (see README, "Sample accounts")
app.seed.enabled=true
app.time-zone=Asia/Ho_Chi_Minh
